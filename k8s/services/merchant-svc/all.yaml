apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-svc
  namespace: vrp-demo
  labels:
    app: merchant-svc
    app.kubernetes.io/part-of: vrp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-svc
  template:
    metadata:
      labels:
        app: merchant-svc
    spec:
      serviceAccountName: vrp-svc-account
      terminationGracePeriodSeconds: 30
      containers:
        - name: merchant-svc
          image: vrp-demo/merchant-svc:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: vrp-config
            - secretRef:
                name: vrp-secrets
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-svc
  namespace: vrp-demo
  labels:
    app: merchant-svc
spec:
  selector:
    app: merchant-svc
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: merchant-svc-pdb
  namespace: vrp-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: merchant-svc
