apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-svc
  namespace: vrp-demo
  labels:
    app: consent-svc
    app.kubernetes.io/part-of: vrp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consent-svc
  template:
    metadata:
      labels:
        app: consent-svc
    spec:
      serviceAccountName: vrp-svc-account
      terminationGracePeriodSeconds: 30
      containers:
        - name: consent-svc
          image: vrp-demo/consent-svc:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          envFrom:
            - configMapRef:
                name: vrp-config
            - secretRef:
                name: vrp-secrets
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: consent-svc
  namespace: vrp-demo
  labels:
    app: consent-svc
spec:
  selector:
    app: consent-svc
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consent-svc-pdb
  namespace: vrp-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: consent-svc
