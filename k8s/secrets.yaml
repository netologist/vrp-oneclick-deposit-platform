# Demo only — replace with External Secrets / SealedSecrets in real clusters.
# Values are base64 of the plaintext demo credentials.
apiVersion: v1
kind: Secret
metadata:
  name: vrp-secrets
  namespace: vrp-demo
  labels:
    app.kubernetes.io/part-of: vrp-demo
type: Opaque
stringData:
  MERCHANT_DB_URL: "postgres://vrp:vrp@postgres:5432/merchant?sslmode=disable"
  CONSENT_DB_URL: "postgres://vrp:vrp@postgres:5432/consent?sslmode=disable"
  PAYMENT_DB_URL: "postgres://vrp:vrp@postgres:5432/payment?sslmode=disable"
  LEDGER_DB_URL: "postgres://vrp:vrp@postgres:5432/ledger?sslmode=disable"
  JWT_SECRET: "super-secret-jwt-key"
  HMAC_SECRET: "super-secret-hmac-key"
  POSTGRES_PASSWORD: "vrp"
