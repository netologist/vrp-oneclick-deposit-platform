apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vrp-postgres-ha
  namespace: vrp-demo
  labels:
    app.kubernetes.io/part-of: vrp-demo
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "200"
      work_mem: "16MB"
      wal_level: "logical" # Required for CDC and replication
      max_wal_size: "2GB"
      min_wal_size: "512MB"
      checkpoint_completion_target: "0.9"

  storage:
    size: 20Gi
    storageClass: standard

  walStorage:
    size: 10Gi
    storageClass: standard

  bootstrap:
    initdb:
      database: payment
      owner: vrp
      secret:
        name: vrp-secrets

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

  affinity:
    podAntiAffinityType: required # Spread replicas across different nodes
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: vrp-postgres-pooler
  namespace: vrp-demo
spec:
  cluster:
    name: vrp-postgres-ha
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "500"
      default_pool_size: "25"
