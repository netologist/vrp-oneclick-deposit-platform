openapi: "3.0.3"
info:
  title: VRP One-Click Deposit API
  description: |
    Pay-by-Bank / VRP payment platform.
    All monetary values are in pence (integer). £50.00 = 5000 pence.
    All requests to /v1/* require Bearer JWT token.
    Idempotency-Key header is required for POST /v1/payments.
  version: "1.0.0"
  contact:
    name: Platform Team
    email: platform@vrp-demo.internal

servers:
  - url: http://localhost:8080/v1
    description: Local development / Gateway

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Money:
      type: object
      required: [amount_pence, currency]
      properties:
        amount_pence:
          type: integer
          format: int64
          example: 5000
        currency:
          type: string
          example: GBP

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: CONSENT_LIMIT_EXCEEDED
        message:
          type: string
          example: "Monthly spending limit exceeded"

    Merchant:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        kyb_status:  { type: string }
        status:      { type: string }
        webhook_url: { type: string, format: uri }
        created_at:  { type: string, format: date-time }

    Consent:
      type: object
      properties:
        id:               { type: string, format: uuid }
        merchant_id:      { type: string, format: uuid }
        consumer_id:      { type: string }
        bank_consent_ref: { type: string }
        status:           { type: string }
        max_per_transaction: { $ref: "#/components/schemas/Money" }
        max_per_month:       { $ref: "#/components/schemas/Money" }
        valid_until:      { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id:               { type: string, format: uuid }
        idempotency_key:  { type: string }
        merchant_id:      { type: string, format: uuid }
        consent_id:       { type: string, format: uuid }
        consumer_id:      { type: string }
        amount:           { $ref: "#/components/schemas/Money" }
        status:           { type: string }
        bank_payment_ref: { type: string }
        risk_decision:    { type: string }

paths:
  /auth/token:
    post:
      summary: Exchange API key for JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
      responses:
        "200":
          description: JWT token
  /merchants:
    post:
      summary: Register merchant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, webhook_url]
              properties:
                name: { type: string }
                webhook_url: { type: string }
      responses:
        "201":
          description: Merchant created with plaintext API key
  /consents:
    post:
      summary: Create VRP consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumer_id, bank_consent_ref, max_per_transaction, max_per_month, valid_until]
      responses:
        "201":
          description: Consent created
  /payments:
    post:
      summary: Initiate one-click payment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_id, amount]
      responses:
        "201":
          description: Payment settled
        "422":
          description: Business rule violation
